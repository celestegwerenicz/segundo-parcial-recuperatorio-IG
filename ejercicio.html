    <body>
        <header>
            <h1>Performance, tecnología y narración en el arte contemporáneo</h1>
            
            <section class="header-contenido">
                <img class="foto-principal" src="img/anderson.jpg" alt="Imagen de Laurie">

                <section class="EncabezadoInfo">
                    <div class="cita">
                        <q>El lenguaje es un virus que viene del espacio exterior.</q>
                        <p>- William S. Burroughs<br> 
                        recurrentemente por Laurie Anderson.<br>
                        <a href="https://www.goodreads.com/author/quotes/4462369.William_S_Burroughs#:~:text=Language%20is%20a%20virus%20from%20outer%20space" target="_blank">
                        fuente.</a></p>
                    </div>
                    
                    <nav>
                        <ul>
                            <li class="actual">
                                <a href="index.html" target="_self">Inicio</a>

                            </li>
                        </ul>
                    </nav>
                </section>

            </section>
        </header>

        <main>
            <form id="formDatos">
                <fieldset id="paso1">
                    <label>
                        Ingresar cantidad de obras: 
                        <input type="number" id="CO">
                    </label>

                    <label>
                        Tiempo de tranferencia por MB: 
                        <input type="number" id="TT">
                    </label>

                    <label>
                        Costo mensual por MB: 
                        <input type="number" id="CM">
                    </label>
                    <button id="S" type="button">Siguiente</button>
                </fieldset>
                
                <fieldset id="paso2" hidden>
                    <label>
                        Nombre de la obra: 
                        <input type="text" id="O">
                    </label>

                    <label>
                        Duracion en Minutos: 
                        <input type="number" id="M">
                    </label>

                    <label>
                        Peso en MB: 
                        <input type="number" id="MB">
                    </label>

                    <button id="GO" type="button">Guardar Obra</button>
                    <button id="paso3" type="button" disabled>Calcular</button>
                </fieldset>
            </form>
        </main>

        <footer> Para contactarse escribir a <a href="mailto:laurie@artedigital.com">laurie@artedigital.com</a> </footer>
